name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        emacs_version:
          - 29.1
          - 29.2
          - snapshot

    steps:
    - uses: actions/checkout@v3

    - name: Set up Emacs
      uses: purcell/setup-emacs@master
      with:
        version: ${{ matrix.emacs_version }}

    - name: Run tests
      run: |
        emacs -batch -Q -L . -l test/unison-sync-mode-tests.el -f ert-run-tests-batch-and-exit

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Emacs
      uses: purcell/setup-emacs@master
      with:
        version: 29.1

    - name: Install package-lint
      run: |
        emacs -batch --eval "(require 'package)" \
              --eval "(add-to-list 'package-archives '(\"melpa\" . \"https://melpa.org/packages/\") t)" \
              --eval "(package-initialize)" \
              --eval "(package-refresh-contents)" \
              --eval "(package-install 'package-lint)"

    - name: Lint package
      run: |
        emacs -batch -l package-lint \
              --eval "(setq package-lint-main-file \"unison-sync-mode.el\")" \
              -f package-lint-batch-and-exit unison-sync-mode.el